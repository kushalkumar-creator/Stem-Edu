<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - StemEdu</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: #FEF3C7;
      color: #B45309;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 10px 0;
    }
    p {
      color: #64748B;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      background-color: #2563EB;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚡ Offline Mode</div>
    <h1>You are currently offline</h1>
    <p>
      Don't worry! Your cached CBSE lesson notes, downloaded practice test MCQs, and handwriting pages are safely available in local storage.
    </p>
    <button onclick="window.location.reload()" class="btn">Retry Connection</button>
  </div>
</body>
</html>
